<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Retirement Buckets</title>
  <desc id="desc">Three retirement buckets—cash, stable income, and growth—connected to spending guardrails.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071c2c"/>
      <stop offset="0.5" stop-color="#0b3544"/>
      <stop offset="1" stop-color="#102a43"/>
    </linearGradient>
    <linearGradient id="cash" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#20c997"/>
      <stop offset="1" stop-color="#83f1c9"/>
    </linearGradient>
    <linearGradient id="stable" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#28a7d8"/>
      <stop offset="1" stop-color="#8ddbf4"/>
    </linearGradient>
    <linearGradient id="growth" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7b61ff"/>
      <stop offset="1" stop-color="#c1b5ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#background)"/>
  <circle cx="1040" cy="55" r="180" fill="#45d3ad" opacity="0.06"/>
  <circle cx="100" cy="390" r="210" fill="#7b61ff" opacity="0.07"/>

  <g font-family="Segoe UI, Inter, Arial, sans-serif" fill="#fff">
    <text x="72" y="88" font-size="22" font-weight="600" letter-spacing="4" fill="#83f1c9">RETIREMENT INCOME PLAYBOOK</text>
    <text x="72" y="151" font-size="52" font-weight="750">Buckets protect the runway.</text>
    <text x="72" y="205" font-size="52" font-weight="750">Guardrails steer the spending.</text>
    <text x="74" y="248" font-size="21" fill="#b9d7e5">An auditable framework for liquidity, growth, and adaptive withdrawals.</text>
  </g>

  <g transform="translate(73 294)" font-family="Segoe UI, Inter, Arial, sans-serif" filter="url(#shadow)">
    <g>
      <rect width="245" height="78" rx="16" fill="#0f4551" stroke="#4cd5ad" stroke-width="2"/>
      <rect width="12" height="78" rx="6" fill="url(#cash)"/>
      <text x="35" y="33" font-size="18" font-weight="700" fill="#fff">01 · CASH</text>
      <text x="35" y="57" font-size="14" fill="#b9d7e5">Near-term paycheck</text>
    </g>
    <g transform="translate(273)">
      <rect width="245" height="78" rx="16" fill="#123f58" stroke="#5fc2e8" stroke-width="2"/>
      <rect width="12" height="78" rx="6" fill="url(#stable)"/>
      <text x="35" y="33" font-size="18" font-weight="700" fill="#fff">02 · STABLE</text>
      <text x="35" y="57" font-size="14" fill="#b9d7e5">Multi-year bridge</text>
    </g>
    <g transform="translate(546)">
      <rect width="245" height="78" rx="16" fill="#243b63" stroke="#9b87ff" stroke-width="2"/>
      <rect width="12" height="78" rx="6" fill="url(#growth)"/>
      <text x="35" y="33" font-size="18" font-weight="700" fill="#fff">03 · GROWTH</text>
      <text x="35" y="57" font-size="14" fill="#b9d7e5">Long-horizon engine</text>
    </g>
    <g transform="translate(819)">
      <rect width="235" height="78" rx="16" fill="#183a46" stroke="#f6c85f" stroke-width="2"/>
      <path d="M28 55 L50 31 L67 44 L92 18" fill="none" stroke="#f6c85f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="28" cy="55" r="4" fill="#f6c85f"/><circle cx="92" cy="18" r="4" fill="#f6c85f"/>
      <text x="110" y="33" font-size="17" font-weight="700" fill="#fff">GUARDRAILS</text>
      <text x="110" y="57" font-size="14" fill="#b9d7e5">Cut · Hold · Raise</text>
    </g>
  </g>
</svg>
